<script>
const c = document.getElementById('stars');
const ctx = c.getContext('2d');
c.width = window.innerWidth; c.height = window.innerHeight;
let stars = Array.from({length: 220}, () => ({
  x: Math.random()*c.width, y: Math.random()*c.height,
  r: Math.random()*1.5, s: Math.random()*0.4+0.15
}));
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  ctx.fillStyle = '#050510'; ctx.fillRect(0,0,c.width,c.height);
  stars.forEach(st => {
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2);
    ctx.fillStyle = 'white'; ctx.fill();
    st.y += st.s; if(st.y > c.height) st.y = 0;
  });
  requestAnimationFrame(draw);
}
draw();
</script><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
